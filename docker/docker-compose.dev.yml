# Geliştirme ortamı. DB/Supabase Docker’da değil; servisler kok .env'den okur.
# Örnek: docker compose -f docker/docker-compose.dev.yml up

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: aidep-nginx
    ports: ["80:80"]
    volumes: [../nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on: [backend, frontend]
    networks: [aidep-net]
    restart: unless-stopped

  backend:
    build: {context: ../backend, dockerfile: Dockerfile}
    container_name: aidep-backend
    env_file: ["../.env"]
    volumes:
      - ../backend:/app
      - ../ml_models:/app/ml_models:ro
    depends_on:
      redis: {condition: service_healthy}
    networks: [aidep-net]
    ports: ["8000:8000"]
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ─── AI SERVİSİ ───────────────────────────────────────────────
  # Rapor §3.3: YOLOv8m + XGBoost ayrı servis
  # GPU için: deploy.resources.reservations.devices[nvidia] ekle
  ai:
    build: {context: ../ai-service, dockerfile: Dockerfile}
    container_name: aidep-ai
    env_file: ["../.env"]
    volumes:
      - ../ml_models:/models:ro   # yolov8m_aidep.pt + xgboost_priority.pkl
      - ../ai-service:/app
    depends_on:
      minio:
        condition: service_healthy
    networks: [aidep-net]
    ports: ["8001:8001"]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL in env for build}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?Set VITE_SUPABASE_ANON_KEY in env for build}
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost/ws}
    container_name: aidep-frontend
    volumes: [../frontend/src:/app/src]
    networks: [aidep-net]
    ports: ["3000:80"]

  redis:
    image: redis:7.2-alpine
    container_name: aidep-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [aidep-net]

  # OSRM — Türkiye haritası, ilk başlatmada ~15 dk (Issue DOC-007)
  osrm:
    image: osrm/osrm-backend:v5.27.1
    container_name: aidep-osrm
    volumes: [osrmdata:/data]
    command: >
      sh -c "
        if [ ! -f /data/turkey-latest.osrm ]; then
          wget -q -O /data/turkey-latest.osm.pbf https://download.geofabrik.de/europe/turkey-latest.osm.pbf &&
          osrm-extract -p /opt/car.lua /data/turkey-latest.osm.pbf &&
          osrm-partition /data/turkey-latest.osrm &&
          osrm-customize /data/turkey-latest.osrm;
        fi &&
        osrm-routed --algorithm mld /data/turkey-latest.osrm --port 5000 --max-table-size 1000"
    ports: ["5000:5000"]
    networks: [aidep-net]

  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-33Z
    container_name: aidep-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-aidep_minio}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"
    volumes: [miniodata:/data]
    ports: ["9001:9001"]
    networks: [aidep-net]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  adminer:
    image: adminer:4.8.1
    container_name: aidep-adminer
    ports: ["8080:8080"]
    networks: [aidep-net]

volumes:
  osrmdata:  {name: aidep_osrmdata}
  miniodata: {name: aidep_miniodata}
networks:
  aidep-net: {name: aidep_network, driver: bridge}
