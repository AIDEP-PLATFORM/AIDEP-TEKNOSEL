worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 20M;
        proxy_read_timeout 3600s;

        location /ai/ {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $ai_upstream http://ai:8001;
            proxy_pass $ai_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /ws/ {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        location /docs {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /openapi.json {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream/openapi.json;
            proxy_set_header Host $host;
        }

        # web konteyneri nginx ile 80 portunda (frontend/Dockerfile + nginx-spa.conf)
        location / {
            proxy_pass http://web:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
