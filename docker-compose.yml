services:
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    networks:
      - aidep-network
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - web

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: postgres
    networks:
      - aidep-network
    restart: unless-stopped
    environment:
      POSTGRES_USER: aidep
      POSTGRES_PASSWORD: aidep_pass
      POSTGRES_DB: aidep
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # 5432 local PostgreSQL ile çakışmasın diye 5433 kullanıyoruz
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidep -d aidep"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    image: aidep-backend:local
    container_name: backend
    networks:
      - aidep-network
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=minio:9000
      - DATABASE_URL=postgresql://aidep:aidep_pass@postgres:5432/aidep

  ai:
    build: ./ai-service
    image: aidep-ai:local
    container_name: ai
    networks:
      - aidep-network
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - YOLO_MODEL_PATH=/models/yolov8s_aidep.pt
    volumes:
      - ./ai-service/ml_models/yolov8s_aidep.pt:/models/yolov8s_aidep.pt:ro

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost/ws}
    image: aidep-web:local
    container_name: web
    networks:
      - aidep-network
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: redis
    networks:
      - aidep-network
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    command: redis-server --requirepass "${REDIS_PASSWORD}" --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: osrm
    networks:
      - aidep-network
    restart: unless-stopped
    volumes:
      - osrmdata:/data
    entrypoint: >
      /bin/sh -c "
      if [ ! -f /data/turkey-latest.osrm ]; then
        if ! command -v wget >/dev/null 2>&1; then
          apt-get update -qq && apt-get install -y -qq --no-install-recommends wget ca-certificates;
        fi &&
        wget -O /data/turkey-latest.osm.pbf https://download.geofabrik.de/europe/turkey-latest.osm.pbf &&
        osrm-extract -p /opt/car.lua /data/turkey-latest.osm.pbf &&
        osrm-partition /data/turkey-latest.osrm &&
        osrm-customize /data/turkey-latest.osrm;
      fi &&
      osrm-routed --algorithm mld /data/turkey-latest.osrm --port 5000 --max-table-size 1000
      "

  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-33Z
    container_name: minio
    networks:
      - aidep-network
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - aidep-network
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY; do sleep 1; done;
      /usr/bin/mc mb --ignore-existing myminio/aidep-photos;
      /usr/bin/mc mb --ignore-existing myminio/aidep-models;
      /usr/bin/mc mb --ignore-existing myminio/aidep-reports;
      exit 0;
      "

  db-migrate:
    build: ./backend
    image: aidep-backend-migrate:local
    container_name: db-migrate
    command: sh -c "cd /app && alembic upgrade head"
    networks:
      - aidep-network
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://aidep:aidep_pass@postgres:5432/aidep

  adminer:
    image: adminer:4.8.1
    container_name: adminer
    networks:
      - aidep-network
    restart: unless-stopped
    ports:
      - "8080:8080"
    profiles:
      - dev

networks:
  aidep-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
  osrmdata:
