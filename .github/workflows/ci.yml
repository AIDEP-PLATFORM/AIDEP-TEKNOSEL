name: CI Pipeline

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run pytest (MVP — integration)
        run: pytest tests/integration -v --cov=app --cov-report=xml --cov-fail-under=0

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install formatters
        run: pip install ruff black
      - name: Check Ruff
        run: ruff check backend/ || echo "Ruff failed"
      - name: Check Black
        run: black --check backend/ || echo "Black failed"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set dummy env for compose interpolation
        run: |
          echo "DATABASE_URL=postgresql://u:p@host:5432/db" >> $GITHUB_ENV
          echo "REDIS_PASSWORD=dummy" >> $GITHUB_ENV
          echo "MINIO_ACCESS_KEY=dummy" >> $GITHUB_ENV
          echo "MINIO_SECRET_KEY=dummy" >> $GITHUB_ENV
      - name: Docker Compose Build
        run: docker compose build
