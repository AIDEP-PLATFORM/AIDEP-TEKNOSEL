[project]
name = "aidep-backend"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.1",
  "sqlalchemy[asyncio]>=2.0.28",
  "asyncpg>=0.29.0",
  "alembic>=1.13.1",
  "geoalchemy2>=0.14.6",
  "pydantic>=2.6.3",
  "pydantic-settings>=2.2.1",
  "httpx>=0.27.0",
  "firebase-admin>=6.4.0",
  "redis>=5.0.2",
  "minio>=7.2.5",
  "cryptography>=42.0.5",
  "python-multipart>=0.0.9",
  "pillow>=10.2.0",
  "beautifulsoup4>=4.12.0",
]
[project.optional-dependencies]
dev = ["pytest>=8.1.1","pytest-asyncio>=0.23.5","ruff>=0.3.3","httpx>=0.27.0"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E","W","F","I","UP"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
