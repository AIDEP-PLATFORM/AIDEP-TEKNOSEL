[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
 
[project]
name = "aidep-backend"
version = "0.1.0"
description = "AIDEP — Afet İyileştirme ve Destek Platformu Backend"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    # Database
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    "geoalchemy2>=0.15.0",
    # Redis
    "redis==5.2.1",
    # Supabase
    "supabase>=2.9.0",
    # Settings
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.0",
    # HTTP Client
    "httpx>=0.27.0",
    # File Upload
    "python-multipart>=0.0.9",
    # Auth / Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

 
# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
 
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | alembic/versions
)/
'''
 
# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
 
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "alembic/versions",
]
 
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "T20", # flake8-print (no print statements)
]
ignore = [
    "S101",  # assert kullanımına izin ver (testlerde gerekli)
    "B008",  # Depends() gibi function call'lara izin ver
    "N803",  # argument name should be lowercase (SQLAlchemy compat)
    "N806",  # variable in function should be lowercase
]
 
[tool.ruff.lint.isort]
known-first-party = ["app"]
 
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "T20"]
"alembic/**/*.py" = ["E501"]
 
# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
 
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
 
# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
 
[tool.coverage.run]
source = ["app"]
omit = [
    "app/alembic/*",
    "app/data/*",
    "tests/*",
]
 
[tool.coverage.report]
show_missing = true
skip_covered = false
# MVP: düşük kapsamda CI kırılmasın; ürün olgunlaştıkça yükseltin (ör. 70).
fail_under = 0

[tool.setuptools]
packages = ["app"]
